<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radio Digital Local</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Fondo animado de ondas y notas musicales -->
  <canvas id="matrixCanvas" aria-hidden="true"></canvas>

  <main class="layout">
    <header class="head-circle">
      <h1>Radio Digital Local</h1>
      <p class="live-badge" id="live" data-live="false">
        <span class="dot"></span>
        <span id="live-text">SIN SEÑAL</span>
        <span class="count"><span id="listeners">0</span> oyentes</span>
      </p>
    </header>

    <!-- Tarjeta del reproductor -->
    <section class="card player">
      <div class="player-top">
        <p class="label">Sonando ahora</p>
        <span class="equalizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </span>
      </div>
      <h2 id="song-title">Esperando transmisión…</h2>
      <p id="song-artist" class="artist"></p>
      <!-- El src se asigna en app.js según el host -->
      <audio id="audio" controls preload="none"></audio>
    </section>

    <div class="columns">
      <!-- Canciones disponibles -->
      <section class="card">
        <h3>Canciones disponibles</h3>
        <ul id="songs" class="list"></ul>
      </section>

      <!-- Cola en tiempo real -->
      <section class="card">
        <h3>Cola de peticiones</h3>
        <ol id="queue" class="list"></ol>
        <p id="queue-empty" class="empty">Aún no hay peticiones. Elige una canción de la lista.</p>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>

  <!-- Animación del canvas detrás de la interfaz -->
  <script>
    (function () {
      const canvas = document.getElementById('matrixCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let w, h, columns, bars, particles;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;

        const barWidth = 14;
        columns = Math.ceil(w / barWidth);
        bars = new Array(columns).fill(0).map(() => ({
          height: Math.random() * h * 0.25 + 15,
          speed: Math.random() * 0.05 + 0.02,
          angle: Math.random() * Math.PI
        }));

        particles = new Array(22).fill(0).map(() => ({
          x: Math.random() * w,
          y: Math.random() * h,
          speedY: Math.random() * 0.6 + 0.2,
          char: ['♪', '♫', '♩', '•', '✦'][Math.floor(Math.random() * 5)],
          opacity: Math.random() * 0.3 + 0.1
        }));
      }

      window.addEventListener('resize', resize);
      resize();

      function tick() {
        ctx.clearRect(0, 0, w, h);

        // Líneas suaves de pulso
        ctx.strokeStyle = 'rgba(44, 44, 44, 0.08)';
        ctx.lineWidth = 1;
        for (let yLine = h * 0.25; yLine < h * 0.75; yLine += h * 0.25) {
          ctx.beginPath();
          ctx.moveTo(0, yLine);
          for (let x = 0; x < w; x += 35) {
            const yOffset = Math.sin(x * 0.012 + Date.now() * 0.002) * 6;
            ctx.lineTo(x, yLine + yOffset);
          }
          ctx.stroke();
        }

        // Notas musicales flotantes
        ctx.font = '15px sans-serif';
        particles.forEach((p) => {
          p.y -= p.speedY;
          if (p.y < -20) {
            p.y = h + 20;
            p.x = Math.random() * w;
          }
          ctx.fillStyle = `rgba(102, 188, 180, ${p.opacity + 0.15})`;
          ctx.fillText(p.char, p.x, p.y);
        });

        // Ecualizador inferior sutil
        const barWidth = w / columns;
        for (let i = 0; i < columns; i++) {
          const bar = bars[i];
          bar.angle += bar.speed;
          let waveHeight = (Math.sin(bar.angle) + Math.sin(bar.angle * 2.5)) * 28 + h * 0.14;
          if (waveHeight < 10) waveHeight = 10;

          const x = i * barWidth;
          const y = h - waveHeight;

          const gradient = ctx.createLinearGradient(x, h, x, y);
          gradient.addColorStop(0, 'rgba(102, 188, 180, 0.38)');
          gradient.addColorStop(1, 'rgba(102, 188, 180, 0.04)');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.roundRect(x + 2, y, barWidth - 4, waveHeight, [4, 4, 0, 0]);
          ctx.fill();
        }
      }

      if (reduceMotion) {
        tick();
      } else {
        setInterval(tick, 40);
      }
    })();
  </script>
</body>
</html>
